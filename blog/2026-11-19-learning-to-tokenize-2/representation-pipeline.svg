<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">A shared view of sequence modeling</title>
<desc id="desc">Raw inputs are encoded into a shorter sequence, transformed by a main network, then decoded into raw-level predictions. Encoder and decoder are conceptual transformations, not necessarily learned networks. Colors distinguish representations before and after the main network.</desc>
