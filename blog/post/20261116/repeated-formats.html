</figure><script>// Same-origin figure documents resize only their own embedding frame.
(() => {
  if (!window.frameElement) return;
  let pending = false;
  const resize = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const height = Math.ceil(document.body.getBoundingClientRect().height) + 2;
      if (window.frameElement.style.height !== height + 'px') window.frameElement.style.height = height + 'px';
    });
  };
  new ResizeObserver(resize).observe(document.body);
  window.addEventListener('load', resize);
  document.fonts.ready.then(resize);
  resize();
})();
</script></body></html>
