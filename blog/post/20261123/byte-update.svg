<rect x="383" y="55" width="38" height="38" fill="#edf0f3" stroke="#929aa5"/><text x="402" y="80" text-anchor="middle" font-size="19" font-weight="bold" fill="#374151">g</text>
<text x="88" y="114" text-anchor="end" font-size="12">Main context</text>
