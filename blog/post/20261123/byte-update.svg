<svg xmlns="http://www.w3.org/2000/svg" width="470" height="219" viewBox="0 42 470 219" role="img" aria-labelledby="title desc">
<title id="title">Main context used to predict each byte</title>
<desc id="desc">Assuming a split between camp and ing, H-Net is inferred to update after p, before predicting i. LH-Net updates after i, before predicting n.</desc>
