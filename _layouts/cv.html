---
layout: default
---
<!-- _layouts/cv.html -->
        {%- assign cv_pdf_url = page.cv_pdf | prepend: 'assets/pdf/' | relative_url -%}
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }} {% if page.cv_pdf %}<a href="{{ cv_pdf_url }}" target="_blank" rel="noopener noreferrer" class="float-right"><i class="fas fa-file-pdf"></i></a>{% endif %}</h1>
            <p class="post-description">{{ page.description }}</p>
          </header>

          <article>
            <object data="{{ cv_pdf_url }}" type="application/pdf" width="100%" height="1100">
              <p><a href="{{ cv_pdf_url }}">Open CV PDF</a></p>
            </object>
          </article>

        </div>
