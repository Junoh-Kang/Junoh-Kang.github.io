<svg xmlns="http://www.w3.org/2000/svg" width="396pt" height="91.4pt" viewBox="0 8 396 91.4" role="img" aria-labelledby="title desc">
  <title id="title">Working baseline rollout cycle with post-hoc correction and resampling</title>
  <desc id="desc">Separate message and LOB history streams condition an autoregressive message generator. The generator emits a candidate message that a post-hoc corrector repairs and validates; failures are rejected and resampled. The simulator updates an individual resting-order set, and separate message and aggregated LOB streams are appended for the next rollout step.</desc>
