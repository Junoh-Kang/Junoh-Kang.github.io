<svg xmlns="http://www.w3.org/2000/svg" width="396pt" height="68pt" viewBox="0 8 396 68" role="img" aria-labelledby="title desc">
<title id="title">Reference-grounded preprocessing</title>
<desc id="desc">Two 22-token serializations reference the same resting order o. A single source box shares price p and submission timestamp tau, and contrasts initial submitted size 100 with current remaining size 60. Initial size connects to the reference size token in LOBS5; remaining size connects to the reference size token in ReLOBGen. Event-order fields are labeled price (two tokens), size (one), delta time (four), and timestamp (five). Both references describe the same order, not two orders or two separate events. Each row has two event tokens, eight reference tokens, and twelve event-order tokens. Numbers inside the reference size tokens illustrate represented quantities rather than vocabulary IDs. Arrows denote preprocessing representation, not inference-time sampling.</desc>
<defs>
  <linearGradient id="reference-highlight"><stop offset="0" stop-color="#edf0f3" stop-opacity="0"/><stop offset="0.04" stop-color="#edf0f3"/><stop offset="0.96" stop-color="#edf0f3"/><stop offset="1" stop-color="#edf0f3" stop-opacity="0"/></linearGradient>
  <linearGradient id="resting-highlight"><stop offset="0" stop-color="#dbe8fa" stop-opacity="0"/><stop offset="0.04" stop-color="#dbe8fa"/><stop offset="0.96" stop-color="#dbe8fa"/><stop offset="1" stop-color="#dbe8fa" stop-opacity="0"/></linearGradient>
  <marker id="arrow-dark" markerWidth="2.5981" markerHeight="3" refX="2.5981" refY="1.5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M0,0 L2.5981,1.5 L0,3 Z" fill="#4b5563"/></marker>
  <marker id="arrow-blue" markerWidth="2.8146" markerHeight="3.25" refX="2.8146" refY="1.625" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M0,0 L2.8146,1.625 L0,3.25 Z" fill="#6c8ebf"/></marker>
  <style>
    .sans{font-family:Helvetica,Arial,sans-serif}
    .math{font-family:"Times New Roman",Times,serif;font-style:italic}
    .edge{fill:none;stroke:#4b5563;stroke-width:0.50;marker-end:url(#arrow-dark)}
    .blue-edge{fill:none;stroke:#6c8ebf;stroke-width:0.65;marker-end:url(#arrow-blue)}
    .line{fill:none;stroke:#59616a;stroke-width:0.35}
  </style>
</defs>
